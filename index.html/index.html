<!DOCTYPE html>
<!-- 声明这是一个 HTML5 网页文档 -->
<html lang="zh-CN">
<head>
    <!-- 设置网页字符编码，保证中文正常显示 -->
    <meta charset="UTF-8">
    <!-- 让网页在手机和电脑上都能按屏幕宽度显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人介绍</title>
    <!-- 引入外部 CSS 样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 网页顶部区域：放姓名和一句简单介绍 -->
    <header>
        <h1>你的姓名</h1>
        <p>一句简单的个人介绍，例如：热爱学习和探索新技术的学生。</p>
    </header>

    <!-- 网页主要内容区域 -->
    <main>
        <!-- 关于我：介绍自己的基本情况 -->
        <section>
            <h2>关于我</h2>
            <p>
                这里可以写一段关于自己的介绍，例如你的学习经历、性格特点、
                擅长的事情，或者你对未来的目标。
            </p>
        </section>

        <!-- 兴趣爱好：用列表展示个人爱好 -->
        <section>
            <h2>兴趣爱好</h2>
            <ul>
                <li>阅读</li>
                <li>运动</li>
                <li>编程</li>
                <li>音乐</li>
            </ul>
        </section>

        <!-- 联系方式：填写邮箱、电话或个人主页 -->
        <section>
            <h2>联系方式</h2>
            <p>邮箱：your-email@example.com</p>
            <p>电话：123-4567-8900</p>
            <p>个人主页：https://example.com</p>
        </section>
    </main>

    <!-- 网页底部区域 -->
    <footer>
        <p>© 2026 你的姓名</p>
    </footer>
</body>
</html>
